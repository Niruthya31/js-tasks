        d -= 8;
        console.log(d);

        // 3. Use *= on 7 with 3
        let e = 7;
        e -= 3;
        console.log(e);

        // 4. Use /= on 40 with 5
        let f = 40;
        f /= 5;
        console.log(f);

        // 5. Use %= on 25 with 4
        let g = 25;
        g %= 4;
        console.log(g);
