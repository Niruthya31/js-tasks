<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concatination</title>
</head>

<body>
    <script>

        // SECTION 7 – String & Concatenation (61–65)

        // 1. Join "Hello" and "World"
        let w1 = "Hello";
        let w2 = "world";
        console.log(w1 + w2);

        // 2. Print full name using +
        console.log("Niruthya" + " Parkavi");

        // 3. Print full name using template string
        console.log(`${"Niruthya"} ${"Parkavi"}`);

        // 4. "10" + 5
        console.log("10" + 5);
        // output = 105

        // 5. 5 + "10"
        console.log(5.5 + "10");
        // output = 5.510

    </script>

</body>

</html>
