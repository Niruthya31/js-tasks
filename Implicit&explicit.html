<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Implicit & Explicit </title>
</head>

<body>
    <script>
        // SECTION 8 – Implicit Type Conversion (66–70)

                      // output    ==> Type
        "5" + 2       // "52"      ==> type( String)
        "5" - 2       //  3        ==> type(Number)
        "5" * 2       // 10        ==> type(Number) 
        true + 1      //  2        ==> type(Number)
        false + "1"   // false1    ==> type( String)


        // SECTION 9 – Explicit Conversion (71–75)

                          //output
        Number("123")     // 123    
        Number("abc")     // NaN
        Number(true)      // 1      
        Boolean("")       // false
        Boolean("hello")  // true

    </script>
</body>

</html>
