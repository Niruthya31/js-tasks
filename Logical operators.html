<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logical operators</title>
</head>

<body>
    <script>

        // SECTION 5 – Logical Operators (46–55)

        true && false       //false
        true || false       //True
        false || false      //false
        !true               //false
        !(5 > 2)            //false
        5 > 3 && 10 > 5     //True
        5 > 3 && 10 < 5     //false
        5 < 3 || 10 < 5     //false
        5 < 3 || 10 > 5     //True
        (5 > 2 && 3 > 1) || (10 < 2)  //True
        
    </script>
</body>

</html>
